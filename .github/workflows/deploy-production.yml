name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra-observabilidade/.github/workflows/container.yml@5fc768f4ebf631bdcd614b3e87a148dc08dd278f
    with:
      context: calculadora
      dockerfile: calculadora/Dockerfile
      image-suffix: '-calculadora'
      publish: ${{ github.event_name != 'pull_request' }}
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: avilaops/infra-observabilidade/.github/workflows/deploy-ssh.yml@5fc768f4ebf631bdcd614b3e87a148dc08dd278f
    with:
      application: app.cifrainssdeobras.com.br
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
  website:
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra-observabilidade/.github/workflows/container.yml@91a1b09899dcd9cd875b76abc78de382e62bbf9e
    with:
      context: website
      dockerfile: website/Dockerfile
      image-suffix: '-website'
      publish: ${{ github.event_name != 'pull_request' }}
  deploy_website:
    needs: website
    if: github.event_name != 'pull_request' && vars.DEPLOY_WEBSITE_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: avilaops/infra-observabilidade/.github/workflows/deploy-ssh.yml@91a1b09899dcd9cd875b76abc78de382e62bbf9e
    with:
      application: cifrainssdeobras.com.br
      image: ${{ needs.website.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_WEBSITE_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
