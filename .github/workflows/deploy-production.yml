name: Build e deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra-observabilidade/.github/workflows/container.yml@bf985921d9964317eb2da588b4645e1275b7e9fc
    with:
      context: calculadora
      dockerfile: calculadora/Dockerfile
      image-suffix: '-calculadora'
      publish: ${{ github.event_name != 'pull_request' }}
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: avilaops/infra-observabilidade/.github/workflows/deploy-ssh.yml@bf985921d9964317eb2da588b4645e1275b7e9fc
    with:
      application: app.cifrainssdeobras.com.br
      image: ${{ needs.image.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
  website:
    permissions:
      contents: read
      packages: write
    uses: avilaops/infra-observabilidade/.github/workflows/container.yml@bf985921d9964317eb2da588b4645e1275b7e9fc
    with:
      context: website
      build-args: |
        NEXT_PUBLIC_WHATSAPP_NUMBER=${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
        NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
        NEXT_PUBLIC_CALCULADORA_URL=${{ vars.NEXT_PUBLIC_CALCULADORA_URL }}
        NEXT_PUBLIC_TAGFLOW_ENABLED=${{ vars.NEXT_PUBLIC_TAGFLOW_ENABLED }}
        NEXT_PUBLIC_TAGFLOW_ENDPOINT=${{ vars.NEXT_PUBLIC_TAGFLOW_ENDPOINT }}
        NEXT_PUBLIC_TAGFLOW_SITE_ID=${{ vars.NEXT_PUBLIC_TAGFLOW_SITE_ID }}
        NEXT_PUBLIC_TAGFLOW_DEBUG=${{ vars.NEXT_PUBLIC_TAGFLOW_DEBUG }}
      dockerfile: website/Dockerfile
      image-suffix: '-website'
      publish: ${{ github.event_name != 'pull_request' }}
  deploy_website:
    needs: website
    if: github.event_name != 'pull_request' && vars.DEPLOY_WEBSITE_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: avilaops/infra-observabilidade/.github/workflows/deploy-ssh.yml@bf985921d9964317eb2da588b4645e1275b7e9fc
    with:
      application: cifrainssdeobras.com.br
      image: ${{ needs.website.outputs.image }}
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_WEBSITE_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
