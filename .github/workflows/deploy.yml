# Deploy do website CIFRA (Next.js static export) para o GitHub Pages.
# O projeto vive em website/ — todos os passos rodam nesse diretório.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export)
        run: npm run build
        env:
          # Variáveis públicas do build. Defina os valores reais em
          # Settings > Secrets and variables > Actions > Variables.
          NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.NEXT_PUBLIC_INSTAGRAM_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_TAGFLOW_ENABLED: ${{ vars.NEXT_PUBLIC_TAGFLOW_ENABLED }}
          NEXT_PUBLIC_TAGFLOW_ENDPOINT: ${{ vars.NEXT_PUBLIC_TAGFLOW_ENDPOINT }}
          NEXT_PUBLIC_TAGFLOW_SITE_ID: ${{ vars.NEXT_PUBLIC_TAGFLOW_SITE_ID }}
          # Com domínio próprio (CNAME) o site fica na raiz — sem basePath.
          # Sem domínio próprio, defina a variável NEXT_PUBLIC_BASE_PATH=/cifra.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
