services:
  cifra-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cifra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_DB: cifra_calculadora
    volumes:
      - cifra-pgdata:/var/lib/postgresql/data

  cifra-calculadora:
    # Imagem construída localmente e publicada no GHCR (calculadora/deploy.mjs).
    # A VPS só faz pull; nada de build aqui (RAM em swap).
    image: ghcr.io/avilaops/cifra-calculadora:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      DATABASE_URL: "postgresql://cifra:${DB_PASSWORD:?defina DB_PASSWORD}@cifra-db:5432/cifra_calculadora?schema=public"
      NEXT_PUBLIC_BASE_PATH: ""
      CALCULADORA_ADMIN_USER: ${CALCULADORA_ADMIN_USER}
      CALCULADORA_ADMIN_PASSWORD: ${CALCULADORA_ADMIN_PASSWORD}
    depends_on:
      - cifra-db

volumes:
  cifra-pgdata:
