<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ávila Ops - Sincronizador e-CAC</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon48.png" alt="Ávila Ops" class="logo" id="logo-img" />
      <h2>Ávila Ops</h2>
    </div>
    
    <p class="description">
      Faça o login no portal e-CAC da Receita Federal e clique no botão abaixo para enviar sua sessão de forma segura.
    </p>

    <div class="status-box" id="status-box">
      <span id="status-text">Aguardando...</span>
    </div>

    <button id="sync-btn" class="btn">
      <span class="btn-text">Sincronizar e-CAC</span>
    </button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
