  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://inssObrafacil.com.br/" />
  <meta property="og:title" content="INSS Obra Fácil — Planejamento Tributário para Obras Inteligentes" />
  <meta property="og:description" content="Economize milhares de reais no INSS da sua obra. Cálculos inteligentes, relatórios profissionais em PDF." />
  <meta property="og:image" content="/og-image.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta property="og:site_name" content="INSS Obra Fácil" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="INSS Obra Fácil — Planejamento Tributário para Obras" />
  <meta name="twitter:description" content="Economize no INSS da sua obra com planejamento tributário inteligente." />

  <!-- Schema.org SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "INSS Obra Fácil",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Software SaaS para planejamento tributário de obras de construção civil baseado na IN RFB 2.021/2021.",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "BRL"
    },
    "audience": {
      "@type": "Audience",
      "audienceType": "Arquitetos, Engenheiros, Construtoras, Contadores"
    }
  }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Theme detection script (runs before React) -->
  <script>
    (function() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored === 'dark' || (!stored && prefersDark);
      document.documentElement.classList.toggle('dark', isDark);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
