server {
  listen 3000;
  listen [::]:3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;
  charset utf-8;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.google-analytics.com https://www.googletagmanager.com https://connect.facebook.net https://www.facebook.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  location = /calculadora {
    return 302 https://app.cifrainssdeobras.com.br;
  }

  location ^~ /calculadora/ {
    return 302 https://app.cifrainssdeobras.com.br;
  }

  location = /healthz {
    default_type text/plain;
    access_log off;
    return 200 "ok\n";
  }

  location = /favicon.svg {
    return 308 /favicon-96x96.png;
  }

  location /_next/static/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }

  location ~* \.(?:ico|jpg|jpeg|png|svg|webp|woff2)$ {
    try_files $uri =404;
    expires 30d;
    access_log off;
  }

  location / {
    expires -1;
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;
}
